<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중등 필수 영단어 1200 · 듣기 퀴즈 &amp; 카드 맞추기</title>
<style>
:root {
  --purple: #7B5EA7;
  --dark-purple: #4A3568;
  --gold: #C9A84C;
  --light-purple: #F3EFFE;
  --bg: #FBFAF8;
  --card-bg: #FFFFFF;
  --text: #2B2532;
  --text-soft: #6B6178;
  --border: #E4DEF0;
  --good: #3F9A5C;
  --bad: #C6553E;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1720;
    --card-bg: #2A2233;
    --text: #F1ECF7;
    --text-soft: #B8ACC9;
    --border: #423755;
    --light-purple: #352A44;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1720;
  --card-bg: #2A2233;
  --text: #F1ECF7;
  --text-soft: #B8ACC9;
  --border: #423755;
  --light-purple: #352A44;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  min-height: 100%;
}
header {
  padding: 20px 16px 14px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: var(--card-bg);
}
header h1 {
  margin: 0 0 4px;
  font-size: 20px;
  color: var(--dark-purple);
  font-weight: 800;
  letter-spacing: -0.01em;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) header h1 { color: #D8C6F2; }
}
:root[data-theme="dark"] header h1 { color: #D8C6F2; }
header p {
  margin: 0;
  font-size: 13px;
  color: var(--text-soft);
}
.tabs {
  display: flex;
  gap: 8px;
  padding: 12px 16px 0;
  max-width: 640px;
  margin: 0 auto;
}
.tab-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 10px 10px 0 0;
  background: var(--light-purple);
  color: var(--text-soft);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.tab-btn.active {
  background: var(--purple);
  color: #fff;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 16px 40px;
}
.panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 0 10px 10px 10px;
  padding: 20px 16px;
}
.hidden { display: none !important; }

/* ---- Listening quiz ---- */
.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--text-soft);
}
.quiz-score { font-weight: 700; color: var(--dark-purple); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .quiz-score { color: #D8C6F2; }
}
:root[data-theme="dark"] .quiz-score { color: #D8C6F2; }

.direction-toggle {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-bottom: 16px;
}
.direction-toggle button {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-soft);
  font-size: 12px;
  cursor: pointer;
}
.direction-toggle button.active {
  background: var(--dark-purple);
  color: #fff;
  border-color: var(--dark-purple);
}

.speak-area {
  text-align: center;
  padding: 28px 12px;
  background: var(--light-purple);
  border-radius: 12px;
  margin-bottom: 18px;
}
.speak-btn {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: none;
  background: var(--purple);
  color: #fff;
  font-size: 30px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(123,94,167,0.35);
}
.speak-btn:active { transform: scale(0.95); }
.speak-hint {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-soft);
}

.choices {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.choice-btn {
  padding: 14px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
  font-size: 15px;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.choice-btn:hover { border-color: var(--purple); }
.choice-btn.correct { border-color: var(--good); background: rgba(63,154,92,0.12); font-weight: 700; }
.choice-btn.wrong { border-color: var(--bad); background: rgba(198,85,62,0.12); }
.choice-btn:disabled { cursor: default; }

.next-row {
  display: flex;
  justify-content: center;
  margin-top: 18px;
}
.next-btn {
  padding: 10px 28px;
  border-radius: 999px;
  border: none;
  background: var(--dark-purple);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.next-btn:disabled { opacity: 0.4; cursor: default; }

.round-score {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  color: var(--dark-purple);
  margin-bottom: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .round-score { color: #D8C6F2; }
}
:root[data-theme="dark"] .round-score { color: #D8C6F2; }
.wrong-list-title {
  text-align: center;
  font-size: 13px;
  color: var(--text-soft);
  margin: 10px 0 12px;
}
.wrong-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 360px;
  overflow-y: auto;
}
.wrong-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(198,85,62,0.08);
  border: 1px solid rgba(198,85,62,0.25);
  font-size: 14px;
}
.wrong-item .w-eng { font-weight: 700; color: var(--bad); }
.wrong-item .w-kor { color: var(--text-soft); text-align: right; }
.no-wrong {
  text-align: center;
  padding: 20px;
  color: var(--good);
  font-weight: 700;
}
.round-transition {
  text-align: center;
  padding: 10px 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  background: var(--light-purple);
  color: var(--dark-purple);
  font-size: 13px;
  font-weight: 700;
}

/* ---- Matching game ---- */
.match-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
  font-size: 13px;
}
.match-controls select {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
}
.new-game-btn {
  padding: 7px 16px;
  border-radius: 999px;
  border: none;
  background: var(--purple);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.match-status {
  text-align: center;
  font-size: 13px;
  color: var(--text-soft);
  margin-bottom: 12px;
}
.match-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.match-card {
  min-height: 76px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--light-purple);
  color: var(--dark-purple);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px 6px;
  cursor: pointer;
  line-height: 1.3;
  transition: transform 0.12s, background 0.12s, border-color 0.12s;
  word-break: keep-all;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .match-card { color: #EADFFB; }
}
:root[data-theme="dark"] .match-card { color: #EADFFB; }
.match-card.matched {
  background: rgba(63,154,92,0.15);
  border-color: var(--good);
  color: var(--good);
  cursor: default;
}
.match-card.selected {
  border-color: var(--purple);
  background: var(--card-bg);
  transform: scale(0.97);
}
.match-card.eng { font-style: italic; }

.group-info {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: var(--light-purple);
  font-size: 12px;
  line-height: 1.6;
}
.group-info .gi-title { font-weight: 800; margin-bottom: 6px; color: var(--dark-purple); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .group-info .gi-title { color: #D8C6F2; }
}
:root[data-theme="dark"] .group-info .gi-title { color: #D8C6F2; }
.group-info .gi-group { margin-bottom: 8px; }
.group-info .gi-item { display: block; }
.group-info .gi-item b { color: var(--purple); }
.win-banner {
  text-align: center;
  padding: 14px;
  margin-top: 14px;
  border-radius: 10px;
  background: rgba(63,154,92,0.12);
  color: var(--good);
  font-weight: 700;
  font-size: 14px;
}

footer {
  text-align: center;
  font-size: 11px;
  color: var(--text-soft);
  padding: 10px 16px 24px;
}

.hidden { display: none !important; }

.name-gate {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
}
.name-gate-box {
  max-width: 360px;
  width: 100%;
  text-align: center;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 24px;
}
.name-gate-icon { font-size: 40px; margin-bottom: 8px; }
.name-gate-box h2 {
  margin: 0 0 8px;
  font-size: 19px;
  color: var(--dark-purple);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .name-gate-box h2 { color: #D8C6F2; }
}
:root[data-theme="dark"] .name-gate-box h2 { color: #D8C6F2; }
.name-gate-box p {
  margin: 0 0 18px;
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.5;
}
.name-gate-box input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  text-align: center;
  margin-bottom: 12px;
}
.name-gate-box button#nameSubmitBtn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: var(--purple);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.name-gate-status {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-soft);
  min-height: 16px;
}

.player-name-tag {
  margin: 8px 0 0 !important;
  font-size: 12px !important;
  color: var(--text-soft) !important;
}
.player-name-tag span { font-weight: 700; color: var(--dark-purple); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .player-name-tag span { color: #D8C6F2; }
}
:root[data-theme="dark"] .player-name-tag span { color: #D8C6F2; }
.player-name-tag button {
  margin-left: 8px;
  border: none;
  background: none;
  color: var(--purple);
  font-size: 11px;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
}

.mastery-bar-wrap {
  max-width: 320px;
  margin: 10px auto 0;
}
.mastery-bar-track {
  height: 8px;
  border-radius: 999px;
  background: var(--light-purple);
  overflow: hidden;
}
.mastery-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--purple), var(--gold));
  border-radius: 999px;
  transition: width 0.3s ease;
}
.mastery-bar-text {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-soft);
  text-align: center;
}

.save-indicator {
  text-align: center;
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 8px;
  min-height: 14px;
}
.speed-row { margin-top: 10px; font-size: 13px; color: var(--text-soft); display:flex; align-items:center; justify-content:center; gap:8px; }
.speed-row input { width: 160px; accent-color: #7B5EA7; }
.day-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; max-width:640px; margin:12px auto 0; padding:0 16px; font-size:14px; color:var(--text-soft); }
.day-bar select { padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:15px; font-weight:700; background:var(--card-bg); color:var(--dark-purple); }
.day-info { font-size:13px; }
.stage-help { font-size:13px; color:var(--text-soft); margin-bottom:10px; line-height:1.5; }
.new-mark { border-left:4px solid #C9A84C; padding-left:6px; }
.listen-count { font-size:13px; font-weight:700; color:var(--purple); margin-bottom:8px; }
.listen-list { display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow-y:auto; }
.listen-item { display:grid; grid-template-columns:36px 1fr 1.4fr; gap:8px; align-items:center; padding:10px 10px; border:1.5px solid var(--border); border-radius:10px; background:var(--light-purple); cursor:pointer; text-align:left; }
.listen-item .li-num { font-size:11px; color:var(--text-soft); }
.listen-item .li-eng { font-weight:800; color:var(--dark-purple); font-style:italic; }
.listen-item .li-kor { font-size:13px; color:var(--text); }
.listen-item.is-new { border-left:5px solid #C9A84C; }
.listen-item.heard { opacity:0.55; }
.listen-item:active { transform:scale(0.99); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .listen-item .li-eng { color:#EADFFB; } }
:root[data-theme="dark"] .listen-item .li-eng { color:#EADFFB; }
</style></head>

<body>

<div class="name-gate" id="nameGate">
  <div class="name-gate-box">
    <div class="name-gate-icon">🎧</div>
    <h2>이름을 입력하세요</h2>
    <p>진행 상황이 저장되어, 다음에 같은 이름으로 들어오면 이어서 할 수 있어요.</p>
    <input type="text" id="nameInput" placeholder="예: 김민수" autocomplete="off">
    <button id="nameSubmitBtn">시작하기</button>
    <div class="name-gate-status" id="nameGateStatus"></div>
  </div>
</div>

<div id="appRoot" class="hidden">

<header>
  <h1>중등 필수 영단어 1200</h1>
  <p>듣기 퀴즈 &amp; 카드 맞추기 · 교육부 지정 중등 필수 영단어</p>
  <p class="player-name-tag">👤 <span id="playerNameTag"></span> <button id="switchUserBtn">다른 이름으로</button></p>
  <div class="mastery-bar-wrap">
    <div class="mastery-bar-track"><div class="mastery-bar-fill" id="masteryBarFill"></div></div>
    <div class="mastery-bar-text" id="masteryBarText">전체 어휘 진행: 0 / 1200 (0%)</div>
  </div>
</header>

<div class="day-bar">
  <label for="daySelect">📅</label>
  <select id="daySelect"></select>
  <span class="day-info" id="dayInfo"></span>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabListenBtn">① 듣기</button>
  <button class="tab-btn" id="tabMatchBtn">② 카드 맞추기</button>
  <button class="tab-btn" id="tabQuizBtn">③ 새 단어 퀴즈</button>
</div>
<main>
  <!-- ① Listening panel -->
  <section class="panel" id="listenPanel">
    <div class="stage-help">단어를 눌러 한 번씩 들어보세요. (영어 → 한글 뜻 순서로 한 번씩 읽어줘요) <b class="new-mark">금색 줄</b> = 오늘 처음 나온 단어</div>
    <div class="listen-count" id="listenCount"></div>
    <div class="listen-list" id="listenList"></div>
    <div class="next-row">
      <button class="next-btn" id="listenNextBtn">② 카드 맞추기로 →</button>
    </div>
  </section>

  <!-- Listening quiz panel -->
  <section class="panel hidden" id="quizPanel">
    <div class="stage-help" id="quizHelp"></div>    <div class="quiz-top">
      <span>라운드 <span id="roundNumLabel">1</span>/5 · 문제 <span id="quizIndex">1</span> / <span id="roundSizeLabel">30</span></span>
      <span class="quiz-score">정답 <span id="quizScore">0</span> / <span id="quizTotal">0</span></span>
    </div>
    <div class="save-indicator" id="saveIndicator"></div>
    <div id="quizQuestionArea">
      <div class="round-transition hidden" id="roundTransition"></div>
      <div class="speak-area">
        <button class="speak-btn" id="speakBtn" aria-label="다시 듣기">🔊</button>
        <div class="speak-hint">버튼을 눌러 소리를 들어보세요</div>
        <div class="speed-row">🐢 <input type="range" id="speedSlider" min="0.5" max="1.1" step="0.05" value="0.8"> <span id="speedLabel">0.8x</span></div>
      </div>

      <div class="choices" id="choicesBox"></div>

      <div class="next-row">
        <button class="next-btn" id="nextBtn" disabled>다음 문제</button>
      </div>
    </div>

    <div id="quizResult" class="hidden">
      <div class="round-score" id="roundScoreText"></div>
      <div class="wrong-list-title" id="wrongListTitle"></div>
      <div class="wrong-list" id="wrongList"></div>
      <div class="next-row">
        <button class="next-btn" id="restartBtn">새 라운드 시작</button>
      </div>
    </div>
  </section>

  <!-- Matching game panel -->
  <section class="panel hidden" id="matchPanel">
    <div class="stage-help" id="matchHelp"></div>
    <div class="match-controls">
      <label for="pairCount">한 판당 카드 쌍:</label>
      <select id="pairCount">
        <option value="6">6쌍 (12장)</option>
        <option value="8">8쌍 (16장)</option>
        <option value="10" selected>10쌍 (20장)</option>
        <option value="12">12쌍 (24장)</option>
      </select>
      <button class="new-game-btn" id="newGameBtn">처음부터 다시</button>
    </div>    <div class="match-status" id="matchStatus">시도 0회 · 남은 쌍 0개</div>
    <div class="match-grid" id="matchGrid"></div>
    <div class="win-banner hidden" id="winBanner"></div>
    <div class="next-row"><button class="next-btn hidden" id="nextBoardBtn">다음 판 →</button></div>
    <div class="group-info hidden" id="groupInfo"></div>
  </section>
</main>

<footer>유노이아 영어국어학원 · Day별로 순서대로 공부해요</footer>

/* ===================== 진행상황 저장(구글 시트) 연동 ===================== */
// 아래 URL을 Apps Script 배포 후 받은 "웹 앱 URL"로 바꿔주세요.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsptm6EXZjg6x5lwYAgmiQG4UCqSuKibhM9EUQiEJw95S-uwIAzI43AInD7M2WYc6a/exec";

let playerName = '';
let saveTimer = null;
let masteredWords = new Set(); // English words the student has ever answered correctly
let wrongCounts = {}; // { englishWord: totalTimesWrong } accumulated across all sessions

function saveIndicatorEl() {
  return document.getElementById('saveIndicator');
}

function updateMasteryDisplay() {
  const fill = document.getElementById('masteryBarFill');
  const text = document.getElementById('masteryBarText');
  const total = VOCAB.length;
  const done = masteredWords.size;
  const pct = total ? Math.round((done / total) * 100) : 0;
  if (fill) fill.style.width = pct + '%';
  if (text) text.textContent = `전체 어휘 진행: ${done} / ${total} (${pct}%)`;
}

function apiSave(state) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('http') !== 0) return;
  const el = saveIndicatorEl();
  if (el) el.textContent = '저장 중...';
  const payload = Object.assign({
    name: playerName,
    masteredWords: Array.from(masteredWords),
    wrongCounts: wrongCounts
  }, state);
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(() => {
    if (el) el.textContent = '저장됨 ✓';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { if (el) el.textContent = ''; }, 1500);
  }).catch(() => {
    if (el) el.textContent = '저장 실패 (인터넷 확인)';
  });
}

function apiLoad(name) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('http') !== 0) {
    return Promise.resolve({ found: false });
  }
  return fetch(APPS_SCRIPT_URL + '?name=' + encodeURIComponent(name))
    .then(r => r.json())
    .catch(() => ({ found: false }));
}

let resumedState = null; // set if we found saved progress to resume

function enterApp(name, loaded) {
  playerName = name;
  playerNameTag.textContent = name;
  nameGate.classList.add('hidden');
  appRoot.classList.remove('hidden');
  masteredWords = new Set((loaded && loaded.found && loaded.masteredWords) ? loaded.masteredWords : []);
  wrongCounts = (loaded && loaded.found && loaded.wrongCounts) ? loaded.wrongCounts : {};
  updateMasteryDisplay();
  resumedState = (loaded && loaded.found && loaded.status !== '완료') ? loaded : null;
  initGameForPlayer();
}

nameSubmitBtn.addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name) {
    nameGateStatus.textContent = '이름을 입력해주세요.';
    return;
  }
  // iOS Safari 등은 '사용자가 직접 누른 순간'에만 음성 재생을 허용하므로,
  // 데이터를 불러오는 비동기 작업을 시작하기 전에 여기서 먼저 음성 엔진을 한 번 깨워둔다.
  try {
    const unlock = new SpeechSynthesisUtterance(' ');
    unlock.volume = 0.01;
    window.speechSynthesis.speak(unlock);
  } catch (e) { /* TTS unavailable */ }

  nameGateStatus.textContent = '이전 진행 상황을 확인하는 중...';
  nameSubmitBtn.disabled = true;
  apiLoad(name).then(loaded => {
    nameSubmitBtn.disabled = false;
    try { localStorage.setItem('middle_voca_last_name', name); } catch (e) {}
    enterApp(name, loaded);
  });
});
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') nameSubmitBtn.click();
});

switchUserBtn.addEventListener('click', () => {

// 자연스러운 음성 우선 선택 (Natural/Neural/Google/Premium 등), 없으면 해당 언어 기본 음성
const GOOD_VOICE = /natural|neural|online|premium|enhanced|google|aria|jenny|samantha|sunhi|heami/i;
function pickVoice(lang) {
  try {
    const base = lang.slice(0, 2).toLowerCase();
    const list = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace('_', '-').indexOf(base) === 0);
    const exact = list.filter(v => v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase());
    const pool = exact.length ? exact : list;
    return pool.find(v => GOOD_VOICE.test(v.name)) || pool[0] || null;
  } catch (e) { return null; }
}

let speakToken = 0;
function speak(text, lang, onend) {
  const myToken = ++speakToken;
  try {
    const doSpeak = () => {
      // 앞쪽 구두점이 짧은 무음 구간이 되어 첫 음절이 잘리는 것을 막는다.
      // 쉼표 뒤에 자연스러운 호흡이 생기도록 단어 끝에도 마침표를 붙인다.
      const u = new SpeechSynthesisUtterance(', , ' + text + '.');
      u.lang = lang;
      const v = pickVoice(lang);
      if (v) u.voice = v;
      u.rate = lang === 'ko-KR' ? Math.min(1.05, speechRate + 0.05) : speechRate;
      u.pitch = 1;
      // 새 음성이 시작되면 이전 음성의 후속 재생(onend)은 취소된다
      if (onend) u.onend = () => { if (myToken === speakToken) onend(); };
      window.speechSynthesis.speak(u);
    };
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      window.speechSynthesis.cancel();
      setTimeout(doSpeak, 120);
    } else {
      doSpeak();
    }
  } catch (e) { /* TTS unavailable */ }
}
// Extracts a short, speakable/displayable Korean meaning from a fuller dictionary-style
// entry: strips a leading "(...)" usage note, then cuts at the first comma/semicolon/
// colon/parenthesis so entries like "(가격을) 끌어올리다" don't come out blank.
function cleanKoreanText(s) {
  let t = s.replace(/^\([^)]*\)\s*/, '');
  t = t.split(/[,;:(]/)[0].trim();
  if (!t) {
    t = s.replace(/[()]/g, '');
    t = t.split(/[,;:]/)[0].trim();
  }
  return t || s;
}

// For speech only: "~" is textbook shorthand for a blank (e.g. "~에 대처하다").
// Reading the raw tilde sounds garbled, so read it aloud as "뭐뭐" instead.
function speakableKorean(s) {
  return cleanKoreanText(s).replace(/~/g, '뭐뭐');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ===================== Day 구성 ===================== */
// day1 = 1~60, day2 = 1~80, day3 = 1~100, 이후 100개씩 20개씩 밀기 (day4 = 21~120, day5 = 41~140 ...)
const TOTAL = VOCAB.length;
const MAX_DAY = 58; // day58 = 1101~1200
function dayRange(d) {
  if (d === 1) return [1, 60];
  if (d === 2) return [1, 80];
  const start = (d - 3) * 20 + 1;
  return [start, Math.min(start + 99, TOTAL)];
}
function prevMax(d) { return d === 1 ? 0 : dayRange(d - 1)[1]; }

let currentDay = 1;
let dayAll = [];     // 오늘 범위 전체
let dayReview = [];  // 어제까지 공부한 단어 (복습)
let dayNew = [];     // 오늘 처음 나오는 단어
let currentStage = 'listen';

const daySelect = document.getElementById('daySelect');
const dayInfo = document.getElementById('dayInfo');
const tabListenBtn = document.getElementById('tabListenBtn');
const tabMatchBtn = document.getElementById('tabMatchBtn');
const tabQuizBtn = document.getElementById('tabQuizBtn');
const listenPanel = document.getElementById('listenPanel');
const matchPanel = document.getElementById('matchPanel');
const quizPanel = document.getElementById('quizPanel');

for (let d = 1; d <= MAX_DAY; d++) {
  const r = dayRange(d);
  const o = document.createElement('option');
  o.value = d;
  o.textContent = `Day ${d} · ${r[0]}~${r[1]}번`;
  daySelect.appendChild(o);
}
daySelect.addEventListener('change', () => setDay(parseInt(daySelect.value, 10)));

function dayKey() { return 'middle_voca_day_' + playerName; }

function setDay(d) {
  currentDay = d;
  daySelect.value = d;
  const r = dayRange(d);
  const pm = prevMax(d);
  dayAll = VOCAB.slice(r[0] - 1, r[1]);
  dayReview = dayAll.filter((v, i) => (r[0] + i) <= pm);
  dayNew = dayAll.filter((v, i) => (r[0] + i) > pm);
  dayInfo.textContent = dayReview.length
    ? `오늘 ${dayAll.length}개 · 복습 ${dayReview.length}개 + 새 단어 ${dayNew.length}개`
    : `오늘 ${dayAll.length}개 · 모두 새 단어`;
  try { localStorage.setItem(dayKey(), d); } catch (e) {}
  buildListen();
  matchInitialized = false;
  quizInitialized = false;
  showStage('listen');
}

function showStage(stage) {
  currentStage = stage;
  const map = { listen: [tabListenBtn, listenPanel], match: [tabMatchBtn, matchPanel], quiz: [tabQuizBtn, quizPanel] };
  Object.keys(map).forEach(k => {
    map[k][0].classList.toggle('active', k === stage);
    map[k][1].classList.toggle('hidden', k !== stage);
  });
  if (stage === 'match' && !matchInitialized) startMatchSet();
  if (stage === 'quiz' && !quizInitialized) startSession();
}
tabListenBtn.addEventListener('click', () => showStage('listen'));
tabMatchBtn.addEventListener('click', () => showStage('match'));
tabQuizBtn.addEventListener('click', () => showStage('quiz'));

function saveProgress() {
  apiSave({
    status: 'in_progress',
    direction: 'eng',
    day: currentDay,
    roundNumber: roundNumber,
    roundIndex: roundIndex,
    roundPool: roundPool,
    score: score,
    roundWrong: roundWrong
  });
}

/* ===================== ① 듣기 (누르면 한 번씩 읽어주기) ===================== */
const listenList = document.getElementById('listenList');
const listenCount = document.getElementById('listenCount');
const listenNextBtn = document.getElementById('listenNextBtn');
let heard = new Set();

// 영어 한 번 → 한글 뜻 한 번
function speakPair(en, ko) {
  speak(en, 'en-US', () => speak(speakableKorean(ko), 'ko-KR'));
}

function updateListenCount() {
  listenCount.textContent = `들어본 단어 ${heard.size} / ${dayAll.length}`;
}

function buildListen() {
  heard = new Set();
  const start = dayRange(currentDay)[0];
  const pm = prevMax(currentDay);
  listenList.innerHTML = '';
  dayAll.forEach((v, i) => {
    const num = start + i;
    const div = document.createElement('div');
    div.className = 'listen-item' + (num > pm ? ' is-new' : '');
    div.innerHTML = '<span class="li-num"></span><span class="li-eng"></span><span class="li-kor"></span>';
    div.querySelector('.li-num').textContent = num;
    div.querySelector('.li-eng').textContent = v[0];
    div.querySelector('.li-kor').textContent = v[1];
    div.addEventListener('click', () => {
      speakPair(v[0], v[1]);
      heard.add(num);
      div.classList.add('heard');
      updateListenCount();
    });
    listenList.appendChild(div);
  });
  updateListenCount();
}
listenNextBtn.addEventListener('click', () => showStage('match'));

/* ===================== ③ 듣고 뜻 고르기 (오늘 새 단어) ===================== */
const FIRST_ROUND_SIZE = 60;
const MAX_ROUNDS = 5;
let quizInitialized = false;
let currentItem = null;
let currentChoices = [];
let answered = false;
let score = 0;
let roundNumber = 1;
let roundPool = [];
let roundIndex = 0;
let roundWrong = [];
let attemptCounts = {}; // per-round retry counter, keyed by English word (reset each round)
const MAX_ATTEMPTS_PER_ROUND = 2; // a missed word gets requeued once, then counts as wrong for the round

const speakBtn = document.getElementById('speakBtn');
const choicesBox = document.getElementById('choicesBox');
const nextBtn = document.getElementById('nextBtn');
const quizIndexEl = document.getElementById('quizIndex');
const quizScoreEl = document.getElementById('quizScore');
const quizTotalEl = document.getElementById('quizTotal');
const roundNumLabel = document.getElementById('roundNumLabel');
const roundSizeLabel = document.getElementById('roundSizeLabel');
const roundTransition = document.getElementById('roundTransition');
const quizQuestionArea = document.getElementById('quizQuestionArea');
const quizResult = document.getElementById('quizResult');
const roundScoreText = document.getElementById('roundScoreText');
const wrongListTitle = document.getElementById('wrongListTitle');
const wrongList = document.getElementById('wrongList');
const restartBtn = document.getElementById('restartBtn');
const quizHelp = document.getElementById('quizHelp');

// 정답과 같은 뜻을 가진 단어가 보기에 섞이면 정답이 둘이 되므로 뜻이 겹치지 않게 뽑는다.
function pickDistractors(correct, n) {
  const used = new Set([correct[1]]);
  const out = [];
  for (const v of shuffle(VOCAB)) {
    if (v[0] === correct[0] || used.has(v[1])) continue;
    used.add(v[1]);
    out.push(v);
    if (out.length >= n) break;
  }
  return out;
}

function startSession() {
  quizInitialized = true;
  roundNumber = 1;
  quizHelp.textContent = `오늘 처음 나온 단어 ${dayNew.length}개 · 영단어를 듣고 알맞은 뜻을 고르세요`;
  roundPool = shuffle(dayNew).slice(0, FIRST_ROUND_SIZE);
  beginRound();
}

function initGameForPlayer() {
  let d = 1;
  try {
    const v = parseInt(localStorage.getItem(dayKey()), 10);
    if (v >= 1 && v <= MAX_DAY) d = v;
  } catch (e) {}
  setDay(d);
}

function beginRound() {
  roundIndex = 0;
  score = 0;
  roundWrong = [];
  attemptCounts = {};
  quizResult.classList.add('hidden');
  quizQuestionArea.classList.remove('hidden');
  quizScoreEl.textContent = 0;
  quizTotalEl.textContent = roundPool.length;
  roundNumLabel.textContent = roundNumber;
  roundSizeLabel.textContent = roundPool.length;
  nextQuestion();
}

function nextQuestion() {
  if (roundIndex >= roundPool.length) {
    finishRound();
    return;
  }
  answered = false;
  roundIndex++;
  quizIndexEl.textContent = roundIndex;
  quizTotalEl.textContent = roundPool.length;
  roundSizeLabel.textContent = roundPool.length;

  currentItem = roundPool[roundIndex - 1];
  currentChoices = shuffle([currentItem, ...pickDistractors(currentItem, 3)]);

  choicesBox.innerHTML = '';
  currentChoices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice[1];
    btn.addEventListener('click', () => selectChoice(btn, choice));
    choicesBox.appendChild(btn);
  });

  nextBtn.disabled = true;
  nextBtn.textContent = roundIndex === roundPool.length ? '라운드 결과' : '다음 문제';
  speakCurrent();
}

function speakCurrent() {
  if (currentItem) speak(currentItem[0], 'en-US');
}
speakBtn.addEventListener('click', speakCurrent);

function selectChoice(btn, choice) {
  if (answered) return;
  answered = true;
  const isCorrect = choice[0] === currentItem[0];
  if (isCorrect) {
    btn.classList.add('correct');
    score++;
    masteredWords.add(currentItem[0]);
    updateMasteryDisplay();
  } else {
    btn.classList.add('wrong');
    const word = currentItem[0];
    wrongCounts[word] = (wrongCounts[word] || 0) + 1; // cumulative, across all sessions
    attemptCounts[word] = (attemptCounts[word] || 0) + 1; // this round only

    if (attemptCounts[word] < MAX_ATTEMPTS_PER_ROUND) {
      // requeue soon (3~5 questions later) so the word gets another shot right away
      const gap = 3 + Math.floor(Math.random() * 3);
      const insertAt = Math.min(roundIndex + gap, roundPool.length);
      roundPool.splice(insertAt, 0, currentItem);
    } else {
      roundWrong.push(currentItem);
    }

    [...choicesBox.children].forEach((c, i) => {
      if (currentChoices[i][0] === currentItem[0]) c.classList.add('correct');
    });
  }
  [...choicesBox.children].forEach(c => c.disabled = true);
  quizScoreEl.textContent = score;
  nextBtn.disabled = false;
  saveProgress();
}

function finishRound() {
  // perfect round, or we've used up all 5 rounds -> end session and show final list
  if (roundWrong.length === 0 || roundNumber >= MAX_ROUNDS) {
    showFinalResult();
    return;
  }
  // otherwise cascade into a new round made only of this round's misses
  roundNumber++;
  roundPool = shuffle(roundWrong);
  roundTransition.textContent = `${roundNumber}차 라운드 시작 · 복습 단어 ${roundPool.length}개`;
  roundTransition.classList.remove('hidden');
  setTimeout(() => roundTransition.classList.add('hidden'), 1600);
  beginRound();
}

function showFinalResult() {
  quizQuestionArea.classList.add('hidden');
  quizResult.classList.remove('hidden');
  roundScoreText.textContent = `Day ${currentDay} 완료 · ${roundNumber}차 라운드까지 진행했어요`;

  apiSave({
    status: 'done',
    direction: 'eng',
    day: currentDay,
    roundNumber: roundNumber,
    roundIndex: roundIndex,
    roundPool: roundPool,
    score: score,
    roundWrong: roundWrong,
    finalWrongWords: roundWrong
  });

  if (roundWrong.length === 0) {
    wrongListTitle.textContent = '';
    wrongList.innerHTML = '<div class="no-wrong">🎉 오늘 새 단어를 모두 맞혔어요!</div>';
  } else {
    wrongListTitle.textContent = `끝까지 틀린 단어 ${roundWrong.length}개 — 복습해보세요`;
    wrongList.innerHTML = '';
    roundWrong.forEach(item => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `<span class="w-eng"></span><span class="w-kor"></span>`;
      div.querySelector('.w-eng').textContent = item[0];
      div.querySelector('.w-kor').textContent = item[1];
      wrongList.appendChild(div);
    });
  }
}

nextBtn.addEventListener('click', nextQuestion);
restartBtn.addEventListener('click', startSession);

/* ===================== ② 카드 맞추기 (복습 단어) ===================== */
let matchInitialized = false;
let selectedCards = [];
let matchedCount = 0;
let totalPairs = 0;
let attempts = 0;
let lockBoard = false;
let matchBoards = [];
let boardIdx = 0;

const pairCountSel = document.getElementById('pairCount');
const newGameBtn = document.getElementById('newGameBtn');
const matchGrid = document.getElementById('matchGrid');
const matchStatus = document.getElementById('matchStatus');
const matchHelp = document.getElementById('matchHelp');
const winBanner = document.getElementById('winBanner');
const nextBoardBtn = document.getElementById('nextBoardBtn');

newGameBtn.addEventListener('click', startMatchSet);
pairCountSel.addEventListener('change', startMatchSet);

// 복습 단어를 N쌍씩 여러 판으로 나눠서 전부 한 번씩 맞춰본다. (첫날은 복습할 단어가 없으니 오늘 단어로 워밍업)
function startMatchSet() {
  matchInitialized = true;
  const src = dayReview.length ? dayReview : dayAll;
  matchHelp.textContent = dayReview.length
    ? `어제까지 공부한 단어 ${src.length}개를 카드로 복습해요`
    : `첫날이라 복습할 단어가 없어서, 오늘 단어 ${src.length}개로 워밍업해요`;
  const per = parseInt(pairCountSel.value, 10);
  const shuffled = shuffle(src);
  matchBoards = [];
  for (let i = 0; i < shuffled.length; i += per) matchBoards.push(shuffled.slice(i, i + per));
  if (matchBoards.length > 1 && matchBoards[matchBoards.length - 1].length < 4) {
    const tail = matchBoards.pop();
    matchBoards[matchBoards.length - 1] = matchBoards[matchBoards.length - 1].concat(tail);
  }
  boardIdx = 0;
  startBoard();
}

function startBoard() {
  winBanner.classList.add('hidden');
  nextBoardBtn.classList.add('hidden');
  selectedCards = [];
  matchedCount = 0;
  attempts = 0;
  lockBoard = false;
  const chosen = matchBoards[boardIdx] || [];
  totalPairs = chosen.length;

  // 같은 뜻이 적힌 카드는 서로 같은 짝으로 인정한다(meaningKey).
  const cards = [];
  chosen.forEach((item, i) => {
    const korText = cleanKoreanText(item[1]);
    cards.push({ type: 'eng', text: item[0], pairId: i, meaningKey: korText });
    cards.push({ type: 'kor', text: korText, pairId: i, meaningKey: korText });
  });

  matchGrid.innerHTML = '';
  shuffle(cards).forEach(card => {
    const div = document.createElement('div');
    div.className = 'match-card' + (card.type === 'eng' ? ' eng' : '');
    div.textContent = card.text;
    div.dataset.pairId = card.pairId;
    div.dataset.type = card.type;
    div.addEventListener('click', () => onCardClick(div, card));
    matchGrid.appendChild(div);
  });
  updateMatchStatus();
}

function updateMatchStatus() {
  matchStatus.textContent = `${boardIdx + 1} / ${matchBoards.length}판 · 시도 ${attempts}회 · 남은 쌍 ${totalPairs - matchedCount}개`;
}

nextBoardBtn.addEventListener('click', () => {
  if (boardIdx < matchBoards.length - 1) {
    boardIdx++;
    startBoard();
  } else {
    showStage('quiz');
  }
});

function onBoardCleared() {
  const last = boardIdx >= matchBoards.length - 1;
  winBanner.textContent = last
    ? '🎉 복습 카드 맞추기를 모두 끝냈어요! 이제 ③ 새 단어 퀴즈로 가볼까요?'
    : `🎉 ${boardIdx + 1}판 완료! 다음 판으로 넘어가요.`;
  nextBoardBtn.textContent = last ? '③ 새 단어 퀴즈로 →' : '다음 판 →';
  winBanner.classList.remove('hidden');
  nextBoardBtn.classList.remove('hidden');
}

function onCardClick(div, card) {
  if (lockBoard) return;
  if (div.classList.contains('matched') || div.classList.contains('selected')) return;
  if (selectedCards.length >= 2) return;

  div.classList.add('selected');
  speak(card.type === 'eng' ? card.text : cleanKoreanText(card.text).replace(/~/g, '뭐뭐'), card.type === 'eng' ? 'en-US' : 'ko-KR');
  selectedCards.push({ div, card });

  if (selectedCards.length === 2) {
    attempts++;
    updateMatchStatus();
    const [a, b] = selectedCards;
    const isMatch = a.card.type !== b.card.type &&
      (a.card.pairId === b.card.pairId || a.card.meaningKey === b.card.meaningKey);

    // 단어 카드 1장 + 뜻 카드 1장으로 짝을 시도한 경우에만 진행률/오답 기록에 반영한다
    const engCard = a.card.type === 'eng' ? a.card : (b.card.type === 'eng' ? b.card : null);
    const testedWord = (a.card.type !== b.card.type && engCard) ? engCard.text : null;

    if (isMatch) {
      a.div.classList.add('matched');
      b.div.classList.add('matched');
      a.div.classList.remove('selected');
      b.div.classList.remove('selected');
      matchedCount++;
      selectedCards = [];
      updateMatchStatus();
      if (testedWord) {
        masteredWords.add(testedWord);
        updateMasteryDisplay();
        saveProgress();
      }
      if (matchedCount === totalPairs) onBoardCleared();
    } else {
      if (testedWord) {
        wrongCounts[testedWord] = (wrongCounts[testedWord] || 0) + 1;
        saveProgress();
      }
      lockBoard = true;
      setTimeout(() => {
        a.div.classList.remove('selected');
        b.div.classList.remove('selected');
        lockBoard = false;
        selectedCards = [];
      }, 700);
    }
  }
}

/* init happens via the name gate -> initGameForPlayer() */
</script>
</body>
</html>
